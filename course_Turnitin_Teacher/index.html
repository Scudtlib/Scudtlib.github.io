<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnitin 教師版 知識攻略戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #10b981;
            --accent: #f59e0b;
        }
        body { font-family: 'Noto Sans TC', sans-serif; overflow-x: hidden; }
        .game-font { font-family: 'Bungee', 'Noto Sans TC', sans-serif; }
        
        .bg-mesh {
            background-color: #f8fafc;
            background-image: radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.1) 0, transparent 50%), 
                              radial-gradient(at 50% 0%, rgba(16, 185, 129, 0.1) 0, transparent 50%);
        }

        /* 內容換題動畫 */
        .content-fade { animation: contentSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes contentSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-enter { animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .xp-float {
            position: absolute;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            z-index: 1000;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.5); }
        }

        .likert-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid #f3f4f6;
            background: white;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .likert-btn:active { transform: scale(0.95); }
        .likert-btn.selected { 
            background-color: var(--primary); 
            color: white; 
            border-color: var(--primary); 
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4); 
        }

        .progress-bar { transition: width 0.6s cubic-bezier(0.65, 0, 0.35, 1); }
    </style>
</head>
<body class="bg-mesh min-h-screen text-gray-800">

    <div id="progress-container" class="fixed top-0 left-0 w-full h-2 bg-gray-200 z-50 hidden">
        <div id="main-progress" class="h-full bg-indigo-600 progress-bar" style="width: 0%"></div>
    </div>

    <div id="app" class="container mx-auto p-4 max-w-2xl min-h-screen flex flex-col justify-center">

        <!-- [首頁] -->
        <div id="home-page" class="text-center card-enter">
            <div class="relative inline-block mb-3">
                <div class="absolute -inset-1 bg-gradient-to-r from-indigo-600 to-emerald-500 rounded-full blur opacity-25"></div>
                <div class="relative bg-white p-6 rounded-full shadow-xl">
                    <svg class="w-16 h-16 text-indigo-500 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                </div>
            </div>
            
            <div class="space-y-2 mb-8">
                <h1 class="text-2xl sm:text-3xl font-black text-gray-900 tracking-tight leading-tight">Turnitin 教師版<br>知識攻略戰</h1>
                <p class="text-indigo-600 font-bold tracking-widest uppercase text-xs sm:text-sm">Turnitin Teacher Edition Mastery Quest</p>
            </div>

            <div class="grid grid-cols-1 gap-4 pt-4">
                <button onclick="startJourney('pre')" class="group relative bg-white p-6 rounded-2xl shadow-md border-2 border-transparent hover:border-indigo-500 transition-all text-left overflow-hidden active:scale-95">
                    <h3 class="text-xl font-bold text-gray-800">登入探險：前測</h3>
                    <p class="text-gray-500 text-sm">評估你對 Turnitin 各項功能的既有認識</p>
                    <div class="mt-4 inline-flex items-center text-indigo-500 font-bold">START <span class="ml-2">→</span></div>
                </button>

                <button onclick="promptForCode()" class="group relative bg-white p-6 rounded-2xl shadow-md border-2 border-transparent hover:border-emerald-500 transition-all text-left overflow-hidden active:scale-95">
                    <h3 class="text-xl font-bold text-gray-800">完成挑戰：後測</h3>
                    <p class="text-gray-500 text-sm">升級你的學術誠信守護力與回饋問卷</p>
                    <div class="mt-4 inline-flex items-center text-emerald-500 font-bold">LEVEL UP <span class="ml-2">→</span></div>
                </button>
            </div>
        </div>

        <!-- [流程頁面] -->
        <div id="quest-page" class="hidden card-enter">
            <div id="quest-card" class="bg-white rounded-3xl shadow-2xl p-6 md:p-10 relative overflow-hidden">
                <div id="step-header" class="mb-8">
                    <span id="step-badge" class="px-3 py-1 bg-indigo-100 text-indigo-600 rounded-full text-xs font-bold uppercase tracking-widest">Question 1</span>
                    <h2 id="question-text" class="text-xl md:text-2xl font-bold text-gray-800 mt-4 leading-relaxed">載入任務中...</h2>
                </div>

                <div id="question-content" class="min-h-[200px]">
                    <!-- 動態內容將插入於此 -->
                </div>

                <div class="flex items-center justify-between mt-12 border-t pt-8">
                    <button id="prev-btn" onclick="prevStep()" class="text-gray-400 font-bold hover:text-gray-600 transition-colors py-2 px-4 rounded-lg">← BACK</button>
                    <div id="step-indicator" class="text-gray-300 font-bold text-sm tracking-widest">01 / 10</div>
                    <button id="next-btn" onclick="nextStep()" class="bg-indigo-600 text-white px-8 py-3 rounded-full font-bold shadow-lg hover:bg-indigo-700 transition-all transform active:scale-95">NEXT</button>
                </div>
            </div>
        </div>

        <!-- [結果頁面] -->
        <div id="results-page" class="hidden text-center card-enter">
             <div class="bg-white p-10 rounded-3xl shadow-2xl space-y-6">
                <div class="w-32 h-32 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-yellow-400">
                    <span class="text-5xl">🏆</span>
                </div>
                <h2 class="text-3xl font-black text-gray-800">任務完成！</h2>
                <p id="success-message" class="text-gray-500 leading-relaxed"></p>
                <div class="pt-6">
                    <button onclick="location.reload()" class="bg-gray-800 text-white px-10 py-4 rounded-full font-bold hover:bg-black transition-all">返回大廳</button>
                </div>
            </div>
        </div>

        <!-- 驗證碼 Modal -->
        <div id="prompt-modal" class="hidden fixed inset-0 bg-gray-900/80 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
            <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm card-enter">
                <h3 class="text-2xl font-bold mb-2">解鎖挑戰</h3>
                <p class="text-gray-500 text-sm mb-6">請輸入課程中公佈的「後測代碼」</p>
                <input type="text" id="prompt-input" class="w-full text-center text-3xl font-black tracking-widest border-2 border-gray-100 rounded-2xl py-4 mb-6 focus:border-emerald-500 outline-none uppercase transition-all" placeholder="••••">
                <div class="flex gap-3">
                    <button onclick="document.getElementById('prompt-modal').classList.add('hidden')" class="flex-1 py-4 bg-gray-100 rounded-2xl font-bold text-gray-500">取消</button>
                    <button onclick="verifyCode()" class="flex-1 py-4 bg-emerald-500 text-white rounded-2xl font-bold shadow-lg shadow-emerald-200">解鎖</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const CONFIG = {
            preTest: {
                url: "https://docs.google.com/forms/d/e/1FAIpQLSfLHo2qcuuFadI6ICc8WlcsBVPeFBiND6-O9-avgQULPKphnw/formResponse",
                entries: { 
                    userId: "entry.378923667", 
                    q1: "entry.241033281", 
                    q2: "entry.183905554", 
                    q3: "entry.469725819", 
                    q4: "entry.4395774", 
                    q5: "entry.965193955", 
                    q6: "entry.1262742436" 
                }
            },
            postTest: {
                url: "https://docs.google.com/forms/d/e/1FAIpQLSdx9P-CGKc9DwcQJpJxz0dz9sXqj6VNufGvvjAFtsuygBLCjA/formResponse",
                entries: { 
                    userId: "entry.378923667", 
                    q1: "entry.1884772553",
                    q2: "entry.1147540420",
                    q3: "entry.1919682382", 
                    q4: "entry.1517460344", 
                    q5: "entry.936698470", 
                    q6: "entry.1323799207", 
                    gender: "entry.408196360", 
                    status: "entry.659472740", 
                    college: "entry.644204744", 
                    department: "entry.702987340", 
                    motivation: "entry.441084087", 
                    satisfaction1: "entry.716809508", 
                    satisfaction2: "entry.739406782", 
                    feedback: "entry.1167175727", 
                    futureTopics: "entry.886271649"
                }
            }
        };

        const assessmentItems = [
            "當我忘記Turnitin登入密碼時，我能夠獨立完成重設密碼的步驟。",
            "為了新學期的『學術寫作』課程，我能夠順利地將全班30位學生的名單一次性地匯入Turnitin課程中。",
            "學期初，我需要為我的『專題研究』課程開設一個繳交草稿的作業區。我能夠獨立完成建立課程、新增作業、並設定一個月後的繳交期限。",
            "一位學生繳交的報告中，因為包含了大量的法規條文，導致相似度偏高。我能夠進入相似度報告，使用篩選功能排除所有『引述資料』，以得到更合理的原創性百分比。",
            "在檢視學生的論文草稿時，我發現相似度報告中有紅色(75-100%)和橙色(50-74%)的區塊。我能夠根據顏色和百分比，向學生解釋這些區塊可能代表的意義，並指導他如何修改。",
            "為了準備與學生的期末面談，我能夠進入課程作業區，一次性下載所有學生的Turnitin相似度報告PDF檔，以便存檔與離線批閱。"
        ];

        const skillDefinitions = [
            { score: 5, label: "精通", desc: "能獨立流暢完成，並清楚解釋。" },
            { score: 4, label: "熟悉", desc: "大致可完成，但需參考說明。" },
            { score: 3, label: "尚可", desc: "需引導，部分功能不熟悉。" },
            { score: 2, label: "略懂", desc: "知道功能，但不清楚如何使用。" },
            { score: 1, label: "未學", desc: "從未聽過此功能。" }
        ];

        let questType = 'pre';
        let currentStep = 0;
        let steps = [];
        let answers = {};

        function startJourney(type) {
            questType = type;
            currentStep = 0;
            answers = {};
            setupSteps();
            renderStep();
            document.getElementById('home-page').classList.add('hidden');
            document.getElementById('quest-page').classList.remove('hidden');
            document.getElementById('progress-container').classList.remove('hidden');
        }

        function setupSteps() {
            steps = [{ type: 'input', label: '身分驗證', question: '請輸入您的學號或人事代碼', id: 'userId', placeholder: '學號 / 人事代碼' }];
            
            assessmentItems.forEach((item, i) => steps.push({ type: 'likert', label: `評估項目 ${i+1}`, question: item, id: `q${i+1}` }));
            
            if (questType === 'post') {
                steps.push({ type: 'select', label: '基本資料', question: '1. 生理性別', id: 'gender', options: ['男', '女'] });
                steps.push({ type: 'select', label: '基本資料', question: '2. 身分別', id: 'status', options: ['大學部', '碩士生', '博士生', '教師', '職員', '其它'] });
                steps.push({ type: 'select', label: '基本資料', question: '3. 學院/單位', id: 'college', options: ['人社院', '外國語文學院', '理學院', '法學院', '商學院', '巨量資料管理學院', '行政單位', '其它'] });
                steps.push({ type: 'input', label: '基本資料', question: '4. 學系/單位', id: 'department', placeholder: '在此輸入...' });
                steps.push({ type: 'checkbox', label: '參與動機', question: '5. 請問您參加本次課程的動機為何？(可複選)', id: 'motivation', options: ['提升論文寫作與研究能力', '增進個人專業知能', '對目前/未來工作有助益', '老師推薦/課程要求', '對主題感興趣', '其他'] });
                steps.push({ type: 'likert', label: '滿意度', question: '6. 今日的課程講授，對於提昇我自己的研究／搜尋技能很有幫助', id: 'satisfaction1' });
                steps.push({ type: 'likert', label: '滿意度', question: '7. 主講人能夠正確並清楚地表達講授的內容', id: 'satisfaction2' });
                
                // 開放性題目
                steps.push({ type: 'textarea', label: '心得回饋', question: '8. 對於本次課程，您有任何建議或想分享的心得嗎?', id: 'feedback', optional: true });
                steps.push({ type: 'textarea', label: '未來期望', question: '9. 您下次希望參加的課程內容為何?', id: 'futureTopics', optional: true });
            }
        }

        function renderStep() {
            const step = steps[currentStep];
            const content = document.getElementById('question-content');
            const questionText = document.getElementById('question-text');
            const stepBadge = document.getElementById('step-badge');
            const indicator = document.getElementById('step-indicator');
            const nextBtn = document.getElementById('next-btn');

            content.classList.remove('content-fade');
            void content.offsetWidth; 
            content.classList.add('content-fade');
            content.innerHTML = ''; 
            
            questionText.innerHTML = `${step.question}${step.optional ? ' <span class="text-gray-400 text-sm font-normal ml-2">(選填)</span>' : ' <span class="text-red-500 font-bold ml-1">*</span>'}`;

            stepBadge.innerText = step.label;
            indicator.innerText = `${String(currentStep + 1).padStart(2, '0')} / ${steps.length}`;
            
            const progress = ((currentStep) / (steps.length - 1)) * 100;
            document.getElementById('main-progress').style.width = `${progress}%`;
            document.getElementById('prev-btn').style.visibility = currentStep === 0 ? 'hidden' : 'visible';
            nextBtn.innerText = currentStep === steps.length - 1 ? 'FINISH' : 'NEXT';

            if (step.type === 'input') {
                const el = document.createElement('input');
                el.type = 'text';
                el.id = `input-${step.id}`;
                el.value = answers[step.id] || '';
                el.className = 'w-full border-b-4 border-gray-100 py-4 text-2xl font-bold outline-none focus:border-indigo-500 transition-all';
                el.placeholder = step.placeholder || '在此輸入...';
                content.appendChild(el);
            } else if (step.type === 'textarea') {
                const el = document.createElement('textarea');
                el.id = `input-${step.id}`;
                el.className = 'w-full border-2 border-gray-100 rounded-2xl p-4 text-lg outline-none focus:border-indigo-500 transition-all';
                el.rows = 4;
                el.value = answers[step.id] || '';
                el.placeholder = '請在此輸入內容...';
                content.appendChild(el);
            } else if (step.type === 'likert') {
                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-5 gap-2 mt-4';
                [5,4,3,2,1].forEach(v => {
                    const btn = document.createElement('button');
                    btn.className = `likert-btn py-6 rounded-2xl font-black text-xl ${answers[step.id] == v ? 'selected' : ''}`;
                    btn.innerText = v;
                    btn.onclick = (e) => {
                        answers[step.id] = v;
                        Array.from(grid.children).forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        createXP(e.clientX, e.clientY);
                        setTimeout(nextStep, 350);
                    };
                    grid.appendChild(btn);
                });
                content.appendChild(grid);
                
                const labels = document.createElement('div');
                labels.className = 'flex justify-between mt-4 text-xs text-gray-400 font-bold px-2';
                const leftLabel = step.label === '滿意度' ? '非常同意 🤩' : '精通 🚀';
                const rightLabel = step.label === '滿意度' ? '非常不同意 😤' : '未學 🕳️';
                labels.innerHTML = `<span>${leftLabel}</span><span>${rightLabel}</span>`;
                content.appendChild(labels);

                if (step.label !== '滿意度') {
                    const criteriaBox = document.createElement('div');
                    criteriaBox.className = 'mt-8 p-4 bg-gray-50 rounded-2xl border border-gray-100';
                    criteriaBox.innerHTML = `
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3 flex items-center">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            評分標準說明
                        </p>
                        <div class="space-y-2">
                            ${skillDefinitions.map(d => `<div class="flex items-start text-xs sm:text-sm"><span class="font-bold text-indigo-500 w-8 flex-shrink-0">${d.score}分</span><span class="text-gray-400 font-bold w-16 flex-shrink-0">(${d.label})</span><span class="text-gray-500">${d.desc}</span></div>`).join('')}
                        </div>`;
                    content.appendChild(criteriaBox);
                }
            } else if (step.type === 'select') {
                const el = document.createElement('select');
                el.id = `input-${step.id}`;
                el.className = 'w-full border-2 border-gray-100 rounded-2xl p-4 text-xl font-bold outline-none focus:border-indigo-500 transition-all';
                el.innerHTML = `<option value="">請選擇...</option>` + step.options.map(o => `<option value="${o}" ${answers[step.id] === o ? 'selected' : ''}>${o}</option>`).join('');
                content.appendChild(el);
            } else if (step.type === 'checkbox') {
                const wrapper = document.createElement('div');
                wrapper.className = 'space-y-3';
                step.options.forEach(o => {
                    const label = document.createElement('label');
                    label.className = 'flex items-center p-4 bg-gray-50 rounded-xl cursor-pointer hover:bg-gray-100 transition-colors';
                    const isChecked = (answers[step.id] || []).includes(o);
                    label.innerHTML = `<input type="checkbox" name="${step.id}" value="${o}" ${isChecked ? 'checked' : ''} class="w-6 h-6 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500"><span class="ml-4 font-medium text-gray-700">${o}</span>`;
                    wrapper.appendChild(label);
                });
                content.appendChild(wrapper);
            }
        }

        function createXP(x, y) {
            const xp = document.createElement('div');
            xp.className = 'xp-float font-black text-indigo-500 text-xl';
            xp.innerText = '+XP';
            xp.style.left = (x - 20) + 'px';
            xp.style.top = (y - 20) + 'px';
            document.body.appendChild(xp);
            setTimeout(() => xp.remove(), 800);
        }

        function nextStep() {
            const step = steps[currentStep];
            if (step.type === 'input' || step.type === 'textarea' || step.type === 'select') {
                const el = document.getElementById(`input-${step.id}`);
                const val = el ? el.value.trim() : '';
                if (!val && !step.optional) return alert('此欄位為必填項目！');
                answers[step.id] = val;
            } else if (step.type === 'likert') {
                if (!answers[step.id] && !step.optional) return alert('請選擇一個評分以繼續探險。');
            } else if (step.type === 'checkbox') {
                const checked = Array.from(document.querySelectorAll(`input[name="${step.id}"]:checked`)).map(c => c.value);
                if (checked.length === 0 && !step.optional) return alert('請至少勾選一項！');
                answers[step.id] = checked;
            }

            if (currentStep < steps.length - 1) {
                currentStep++;
                renderStep();
            } else {
                submitFinal();
            }
        }

        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        }

        function submitFinal() {
            const config = questType === 'pre' ? CONFIG.preTest : CONFIG.postTest;
            const params = new URLSearchParams();
            params.append(config.entries.userId, answers.userId);
            for(let i=1; i<=6; i++) params.append(config.entries[`q${i}`], answers[`q${i}`]);
            
            if (questType === 'post') {
                params.append(config.entries.gender, answers.gender);
                params.append(config.entries.status, answers.status);
                params.append(config.entries.college, answers.college);
                params.append(config.entries.department, answers.department);
                if (answers.motivation) answers.motivation.forEach(m => params.append(config.entries.motivation, m));
                params.append(config.entries.satisfaction1, answers.satisfaction1);
                params.append(config.entries.satisfaction2, answers.satisfaction2);
                params.append(config.entries.feedback, answers.feedback || "");
                params.append(config.entries.futureTopics, answers.futureTopics || "");
            }

            fetch(config.url, { 
                method: 'POST', 
                mode: 'no-cors', 
                headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                body: params.toString() 
            })
            .then(() => {
                document.getElementById('success-message').innerText = questType === 'pre' ? 
                    '感謝您的填答，請專心上課唷！' : 
                    '感謝您今日的參與及填寫回饋問卷。您的學術守護力已經升級！';
                document.getElementById('quest-page').classList.add('hidden');
                document.getElementById('results-page').classList.remove('hidden');
                document.getElementById('progress-container').classList.add('hidden');
            });
        }

        function promptForCode() {
            document.getElementById('prompt-modal').classList.remove('hidden');
            document.getElementById('prompt-input').focus();
        }

        function verifyCode() {
            const code = document.getElementById('prompt-input').value.trim().toUpperCase();
            if (code === 'TIT2026') {
                document.getElementById('prompt-modal').classList.add('hidden');
                startJourney('post');
            } else {
